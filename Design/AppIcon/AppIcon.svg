<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824×824 squircle centered on a 1024×1024 canvas, leaving room for the shadow. -->
  <defs>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000" filter="url(#iconShadow)"/>

  <!-- "Whiskers" (3b) mark from Logo.dc.html, drawn in its 100×100 view box over the full squircle. -->
