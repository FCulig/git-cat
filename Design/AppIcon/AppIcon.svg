      M40.5 47 H43.5 V50.5 H47 V53.5 H43.5 V57 H40.5 V53.5 H37 V50.5 H40.5 Z
      M53 50.5 H63 V53.5 H53 Z
      M47 58.5 H53 L50 62 Z
      M30.5 27.5 L31.5 37.5 L38.5 33 Z
      M69.5 27.5 L68.5 37.5 L61.5 33 Z"/>
    <path d="M21 55 L9 52.5 M21 60 L10 62 M79 55 L91 52.5 M79 60 L90 62" stroke="#F5F5F7" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M14 70 H47" stroke="#30D158" stroke-width="6" stroke-linecap="round"/>
    <path d="M53 70 H86" stroke="#FF453A" stroke-width="6" stroke-linecap="round"/>
  </g>
  </g>
</svg>
